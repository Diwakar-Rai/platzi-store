<nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">
  <div class="flex gap-6 items-center">
    <a routerLink="/" class="text-lg font-semibold hover:text-gray-300"> Platzi Store </a>

    <a routerLink="/products" class="hover:text-gray-300 transition"> Products </a>
    <div class="flex items-center gap-1">
      <a routerLink="/cart" class="hover:text-gray-300 transition"> Cart </a>

      @if (totalItems() > 0) {
        <span
          class="bg-blue-500 text-[8px] px-2 py-1 rounded-full"
          [class.scale-125]="animate()"
          [class.scalse-100]="!animate()"
        >
          {{ cartService.totalItems() }}
        </span>
      }
    </div>
    @if (isAuthenticated()) {
      <a routerLink="/profile" class="hover:text-gray-300"> Profile </a>
    }
  </div>

  <div class="flex">
    @if (user()) {
      <section class="flex gap-2 items-center">
        <img [src]="user()?.avatar" alt="" class="h-10 w-10 rounded-full" />
        <span class="mr-4 text-sm">{{ user()?.name }}</span>
      </section>
    }
    @if (!isAuthenticated()) {
      <a routerLink="/login" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500 transition">
        Login
      </a>
    }

    @if (isAuthenticated()) {
      <button (click)="logout()" class="bg-red-600 px-4 py-2 rounded hover:bg-red-500 transition">
        Logout
      </button>
    }
  </div>
</nav>
