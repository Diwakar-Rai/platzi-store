<div class="bg-white shadow-lg rounded-xl p-6 space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Title</label>
    <input [(ngModel)]="title" class="w-full border px-3 py-2 rounded" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Price</label>
    <input type="number" [(ngModel)]="price" class="w-full border px-3 py-2 rounded" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Description</label>
    <textarea [(ngModel)]="description" class="w-full border px-3 py-2 rounded"></textarea>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Image URL</label>
    <input [(ngModel)]="image" class="w-full border px-3 py-2 rounded" />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Category</label>
    <select [(ngModel)]="categoryId" class="w-full border px-3 py-2 rounded">
      @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">
          {{ cat.name }}
        </option>
      }
    </select>
  </div>

  <button
    (click)="submit()"
    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500 transition"
  >
    Save
  </button>
</div>
