<div class="min-h-[80vh] flex items-center justify-center bg-gray-50">
  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Welcome Back</h2>

    <form (ngSubmit)="onLogin()" #form="ngForm" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          email
          [(ngModel)]="email"
          #emailRef="ngModel"
          class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          [class.border-red-500]="emailRef.invalid && emailRef.touched"
        />

        @if (emailRef.invalid && emailRef.touched) {
          <p class="text-red-500 text-xs mt-1">Please enter a valid email.</p>
        }
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>

        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            required
            minlength="6"
            [(ngModel)]="password"
            #passwordRef="ngModel"
            class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
            [class.border-red-500]="passwordRef.invalid && passwordRef.touched"
          />

          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-2 top-2 text-sm text-gray-500"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>

        @if (passwordRef.invalid && passwordRef.touched) {
          <p class="text-red-500 text-xs mt-1">Password must be at least 6 characters.</p>
        }
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="w-4 h-4" />
        <label class="text-sm">Remember me</label>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-500 transition disabled:opacity-50"
      >
        @if (!loading()) {
          Login
        }
        @if (loading()) {
          Logging in...
        }
      </button>
    </form>

    <p class="text-sm text-center mt-6">
      Don't have an account?
      <a routerLink="/register" class="text-blue-600 hover:underline"> Register </a>
    </p>
  </div>
</div>
