@if (loading()) {
  <app-loader message="Products Loading..."></app-loader>
}

@if (!loading() && error()) {
  <app-error-message message="Failed to load products."></app-error-message>
}

@if (!loading() && !error() && products().length === 0) {
  <p>No products available.</p>
}
<div class="flex flex-wrap gap-4 mb-6">
  <input
    type="text"
    placeholder="Search..."
    [value]="title()"
    #searchInput
    class="border px-3 py-2 rounded w-48"
  />

  <input
    type="number"
    placeholder="Min Price"
    [value]="priceMin() ?? ''"
    #minInput
    class="border px-3 py-2 rounded w-32"
  />

  <input
    type="number"
    placeholder="Max Price"
    [value]="priceMax() ?? ''"
    #maxInput
    class="border px-3 py-2 rounded w-32"
  />

  <button
    (click)="applyFilters(searchInput, minInput, maxInput)"
    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500"
  >
    Apply
  </button>
</div>
@if (!loading() && !error() && products().length > 0) {
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    @for (product of products(); track product.id) {
      <app-product-card [product]="product"></app-product-card>
    }
  </div>
  <div class="flex justify-center gap-4 mt-8">
    <button (click)="previousPage()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
      Previous
    </button>

    <button (click)="nextPage()" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
      Next
    </button>
  </div>
}
